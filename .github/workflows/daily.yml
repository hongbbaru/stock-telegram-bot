name: Daily Stock Fear & Greed Report

on:
  schedule:
    # UTC 20:43 = 한국 시간(KST) 매일 아침 05:43
    # 정각/5분 단위를 완전히 피해서 대기열 씹힘 방지
    - cron: '43 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests

      - name: Run Python script
        run: python main.py
