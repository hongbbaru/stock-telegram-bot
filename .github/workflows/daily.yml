name: Daily Stock Fear & Greed Report

on:
  schedule:
    # UTC 21:03 = 한국 시간(KST) 매일 아침 06:03 (대기열을 피하기 위해 3분으로 설정)
    - cron: '3 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests

      - name: Run Python script
        run: python main.py
