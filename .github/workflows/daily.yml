name: Daily Stock Fear & Greed Report

on:
  schedule:
    # 한국 시간(KST) 아침 06:03에 정확히 실행되도록 지정
    # (UTC 기준 전날 21:03)
    - cron: '3 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests

      - name: Run Python script
        run: python main.py
