name: Daily Stock Fear & Greed Report

on:
  schedule:
    # UTC 20:07 = 한국 시간(KST) 매일 아침 05:07
    # 미국 장 마감(05:00) 직후 최신 데이터 수집 및 서버 대기열 우회
    - cron: '7 20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests

      - name: Run Python script
        run: python main.py
