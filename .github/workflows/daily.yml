name: Daily Stock Fear & Greed Report

on:
  schedule:
    # UTC 기준 23:00 = 한국 시간(KST) 매일 아침 08:00 자동 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 필요할 때 수동으로도 실행 가능하게 설정

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 최신 main 브랜치 코드를 강제로 새로 불러오는 설정(fetch-depth: 0)
      - name: Check out latest code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy matplotlib requests

      - name: Run Python script
        run: python main.py
